{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-transit-backend
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider:
    vault:
      server: "https://vault-transit.vault-transit.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: "Secret"
        name: "vault-transit-ca"
        namespace: "vault"
        key: "ca.crt"
      auth:
        tokenSecretRef:
          name: "vault-transit-token"
          namespace: "vault"
          key: "token"
{{- end }}
