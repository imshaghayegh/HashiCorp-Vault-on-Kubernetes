# Values for a Local Path Provisioner chart; validate the keys against
# the specific chart version mirrored in the environment.
storageClass:
  create: true
  name: local-path
  defaultClass: false
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /opt/local-path-provisioner
